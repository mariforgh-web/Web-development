<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .slider {
            width: 400px;
            height: 250px;
            overflow: hidden;

        }
        .Images {
            display: flex;
            width: 300%;
        }
        .Images img {
            width: 400px;
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="Images" id="slides">
            <img src="https://tse2.mm.bing.net/th/id/OIP.EZ0zmhxvnRTjEFdGF7IoJAHaEo?pid=Api&P=0&h=180" alt="Image first">
            <br>
            <img src="https://tse2.mm.bing.net/th/id/OIP.LYXeVIluROGZ9i6aDZxBmgHaEJ?pid=Api&P=0&h=180" alt="Image second">
            <br>
            <img src="https://tse3.mm.bing.net/th/id/OIP.idAE1jHVUzOQLXtXUw-x4wHaEK?pid=Api&P=0&h=180" alt="Image third">
        </div>
    </div>
    <div class="buttons">
        <button onclick="">Left</button>
        <button onclick="nextSlide()">Right</button>
    </div>
    <script>
        // Current image index
        let index = 0;

        // Get slides container
        const slides = document.getElementById("slides"); 
        
        // Total images
        const totalSlides = 3;

        totalSlides = totalSlides + 1

        // Move to next image
        function nextSlide(){
            index = (index + 1) % totalSlides;
          index = (0 + 1) % totalSlides;
        // Shift images horizontally
        slides.style.transform = `translateX(-${index * 400}px)`;
        }
    </script>
</body>
</html>
